<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>ГравиШар — рисуй путь</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#050505;color:#f5f5f5}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:active{transform:scale(.985)}button:disabled{opacity:.3;cursor:default}
#app{height:100vh;height:100dvh;width:100%;max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;gap:13px;background:#050505;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;min-height:30px;padding:0 3px}
.logo{font-size:15px;letter-spacing:.19em;font-weight:800}
.level{font-size:12px;letter-spacing:.05em;color:#888}
.board{flex:1;min-height:0;position:relative;background:#080808;border:1px solid #262626;border-radius:18px;overflow:hidden;touch-action:none!important;overscroll-behavior:none}
canvas{width:100%;height:100%;display:block;touch-action:none!important;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.controls{display:grid;grid-template-columns:1fr 1fr 1.55fr;gap:9px;min-height:49px}
.control{min-width:0;min-height:49px;border:1px solid #353535;border-radius:13px;background:#171717;color:#e9e9e9;font-size:13px;font-weight:650}
.control.primary{background:#f5f5f5;color:#111;border-color:#f5f5f5;font-size:14px;font-weight:800}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.77);display:flex;align-items:center;justify-content:center;padding:22px;z-index:2;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.overlay[hidden]{display:none}
.modal{width:100%;max-width:325px;padding:28px 22px 22px;background:#121212;border:1px solid #383838;border-radius:20px;text-align:center;box-shadow:0 16px 64px #0009}
.result-mark{font-size:32px;line-height:1.2;color:#f4f4f4}
.modal h2{font-size:23px;line-height:1.25;letter-spacing:-.04em;margin:13px 0 7px}
.modal p{font-size:13px;line-height:1.55;color:#999;margin:0 0 24px}
.modal-actions{display:flex;gap:9px}
.modal-actions button{flex:1;min-width:0;padding:13px 10px;border:1px solid #454545;background:#232323;border-radius:11px;color:#fff;font-size:13px;font-weight:750}
.modal-actions .next{background:#f5f5f5;color:#111;border-color:#f5f5f5}
@media(min-width:540px){#app{padding-left:17px;padding-right:17px}.control{min-height:55px}}
@media(max-height:570px){#app{gap:7px;padding-top:calc(env(safe-area-inset-top) + 6px);padding-bottom:calc(env(safe-area-inset-bottom) + 6px)}.controls,.control{min-height:39px}.modal{padding:18px}}
</style>
</head>
<body>
<main id="app">
 <header><div class="logo">ГРАВИШАР</div><div class="level" id="level">01</div></header>
 <section id="board" class="board" aria-label="Игровое поле">
  <canvas id="canvas" aria-label="Рисуйте пальцем линии, направляющие шарик в круг"></canvas>
  <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="resultTitle" hidden>
   <div class="modal">
    <div class="result-mark" id="resultMark">●</div>
    <h2 id="resultTitle">Результат</h2>
    <p id="resultText"></p>
    <div class="modal-actions" id="modalActions">
     <button id="again">Повторить</button>
     <button class="next" id="next">Дальше →</button>
    </div>
   </div>
  </div>
 </section>
 <nav class="controls" aria-label="Управление игрой">
  <button class="control" id="undo">↶ Отмена</button>
  <button class="control" id="clear">Очистить</button>
  <button class="control primary" id="play">▶ Запуск</button>
 </nav>
</main>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id);
const canvas=$('canvas'),ctx=canvas.getContext('2d',{alpha:false});
const W=360,H=520,R=8;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rng=seed=>()=>{seed=(seed+0x6d2b79f5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296};
let level=1,phase='ready',clock=0,elapsed=0,strokes=[],platforms=[],hazards=[],stars=[],trail=[];
let spawn={x:46,y:52},goal={x:309,y:480},ball={x:46,y:52,vx:0,vy:0};
let drawing=null,pointerId=null,tapStart=null,hasDrawn=false;
const TAP_THRESHOLD_PX=12;
try{level=Math.max(1,Math.floor(Number(localStorage.getItem('gravishar-level'))||1))}catch(_){ }
function nearest(x,y,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=clamp(((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy||1),0,1);return{x:a.x+dx*t,y:a.y+dy*t}}
function makeLevel(){
 const random=rng((Math.random()*0xffffffff>>>0)^Math.imul(level,173771));
 const between=(a,b)=>a+(b-a)*random();
 spawn={x:level%2?46:314,y:54};goal={x:level%2?308:52,y:478};
 strokes=[];platforms=[];hazards=[];stars=[];
 let count=Math.min(5,2+Math.floor((level-1)/3));
 for(let i=0;i<count;i++){
  const length=between(72,116),x=between(20,W-length-20),y=155+i*240/Math.max(1,count-1)+between(-14,14),angle=between(-24,24);
  platforms.push({a:{x,y:y-angle/2},b:{x:x+length,y:y+angle/2}});
 }
 function freePoint(y){let p={x:W/2,y};for(let i=0;i<60;i++){
  p={x:between(33,327),y:clamp(y+between(-19,19),75,450)};
  if(distance(p,spawn)<45||distance(p,goal)<48)continue;
  if(platforms.some(s=>distance(p,nearest(p.x,p.y,s.a,s.b))<30))continue;
  if([...hazards,...stars].some(s=>distance(p,s)<36))continue;
  return p;
 }return p}
 if(level>=3)for(let i=0;i<Math.min(3,1+Math.floor((level-3)/4));i++)hazards.push({...freePoint(264+i*80),r:12});
 for(let i=0;i<3;i++)stars.push({...freePoint(121+i*130),got:false});
 resetRun(false);
}
function resetRun(keepLines=true){
 if(!keepLines)strokes=[];
 ball={x:spawn.x,y:spawn.y,vx:0,vy:0};elapsed=0;trail=[];
 stars.forEach(s=>s.got=false);
 phase='ready';drawing=null;pointerId=null;tapStart=null;hasDrawn=strokes.length>0;
 $('overlay').hidden=true;$('play').disabled=false;$('play').textContent='▶ Запуск';
 controls();
}
function controls(){
 const lock=phase==='running';
 $('undo').disabled=lock||(!strokes.length&&!tapStart);
 $('clear').disabled=lock||!strokes.length;
 $('play').disabled=lock;
 $('level').textContent=String(level).padStart(2,'0');
}
function finish(won,reason){
 phase=won?'won':'lost';
 const collected=stars.filter(s=>s.got).length;
 $('resultMark').textContent=won?'✦':'○';
 $('resultTitle').textContent=won?'Уровень пройден':'Не получилось';
 $('resultText').textContent=won?`Звёзды: ${collected} из 3 · Время: ${elapsed.toFixed(1)} с`:reason;
 $('next').hidden=!won;
 $('overlay').hidden=false;
 controls();
}
function coords(e){const r=canvas.getBoundingClientRect();return{x:clamp((e.clientX-r.left)*W/r.width,3,W-3),y:clamp((e.clientY-r.top)*H/r.height,3,H-3)}}
function addSegment(a,b){if(distance(a,b)<6)return;strokes.push({points:[a,b]});hasDrawn=true;controls()}
function down(e){
 if(phase!=='ready'||pointerId!==null)return;
 e.preventDefault();pointerId=e.pointerId;
 try{canvas.setPointerCapture(pointerId)}catch(_){ }
 drawing={points:[coords(e)],moved:false,startClientX:e.clientX,startClientY:e.clientY};
}
function move(e){
 if(e.pointerId!==pointerId||!drawing)return;
 e.preventDefault();
 const p=coords(e),arr=drawing.points,a=arr[arr.length-1];
 // A finger shift of up to 12 screen pixels still counts as a tap.
 // Once it passes the threshold it becomes a freehand stroke, with no mode switch.
 if(!drawing.moved){
  const movement=Math.hypot(e.clientX-drawing.startClientX,e.clientY-drawing.startClientY);
  if(movement<TAP_THRESHOLD_PX)return;
  drawing.moved=true;tapStart=null;strokes.push(drawing);
 }
 if(distance(a,p)<2)return;
 arr.push(p);hasDrawn=true;controls();
}
function up(e){
 if(e.pointerId!==pointerId)return;
 e.preventDefault();pointerId=null;
 if(drawing&&!drawing.moved){
  const p=drawing.points[0];
  if(tapStart){
   if(distance(tapStart,p)>=6){addSegment(tapStart,p);tapStart=null}
   // A double tap in almost the same spot retains the anchor.
  }else tapStart=p;
 }
 drawing=null;controls();
}
function cancel(e){
 if(e.pointerId!==pointerId)return;
 pointerId=null;drawing=null;controls();
}
canvas.addEventListener('pointerdown',down);
canvas.addEventListener('pointermove',move);
canvas.addEventListener('pointerup',up);
canvas.addEventListener('pointercancel',cancel);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
// Do not intercept touches on the result dialog. On iOS canceling
// touchstart on the board suppresses the native click on modal buttons.
for(const name of ['touchstart','touchmove','gesturestart']){
 canvas.addEventListener(name,e=>{if(e.cancelable)e.preventDefault()},{passive:false});
}
$('undo').addEventListener('click',()=>{if(phase!=='ready')return;if(tapStart)tapStart=null;else strokes.pop();controls()});
$('clear').addEventListener('click',()=>{if(phase!=='ready')return;strokes=[];tapStart=null;controls()});
$('play').addEventListener('click',()=>{if(phase!=='ready')return;tapStart=null;phase='running';controls()});
$('again').addEventListener('click',()=>resetRun(true));
$('next').addEventListener('click',()=>{if(phase!=='won')return;level++;try{localStorage.setItem('gravishar-level',String(level))}catch(_){ }makeLevel()});
function hitSegment(a,b){
 const q=nearest(ball.x,ball.y,a,b),dx=ball.x-q.x,dy=ball.y-q.y,d=Math.hypot(dx,dy),radius=R+3.3;
 if(d>=radius)return;
 let nx,ny;
 if(d>1e-6){nx=dx/d;ny=dy/d}else{
  const l=distance(a,b)||1;nx=-(b.y-a.y)/l;ny=(b.x-a.x)/l;
  if(nx*ball.vx+ny*ball.vy>0){nx=-nx;ny=-ny}
 }
 ball.x+=nx*(radius-d);ball.y+=ny*(radius-d);
 const dot=ball.vx*nx+ball.vy*ny;
 if(dot<0){ball.vx-=1.13*dot*nx;ball.vy-=1.13*dot*ny;ball.vx*=.998;}
}
function physics(dt){
 elapsed+=dt;ball.vy+=540*dt;
 const speed=Math.hypot(ball.vx,ball.vy);
 if(speed>760){ball.vx*=760/speed;ball.vy*=760/speed}
 ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
 ball.vx*=.9995;
 if(ball.x<10){ball.x=10;ball.vx=Math.abs(ball.vx)*.65}
 if(ball.x>350){ball.x=350;ball.vx=-Math.abs(ball.vx)*.65}
 if(ball.y<10){ball.y=10;ball.vy=Math.abs(ball.vy)*.7}
 for(const p of platforms)hitSegment(p.a,p.b);
 for(const s of strokes)for(let i=1;i<s.points.length;i++){
  const a=s.points[i-1],b=s.points[i];
  if(ball.x<Math.min(a.x,b.x)-14||ball.x>Math.max(a.x,b.x)+14||ball.y<Math.min(a.y,b.y)-14||ball.y>Math.max(a.y,b.y)+14)continue;
  hitSegment(a,b);
 }
 for(const h of hazards)if(distance(ball,h)<R+h.r-1){finish(false,'Шарик попал в препятствие');return}
 for(const s of stars)if(!s.got&&distance(ball,s)<19)s.got=true;
 if(distance(ball,goal)<23){finish(true,'');return}
 if(ball.y>H+13){finish(false,'Шарик упал мимо цели');return}
 if(elapsed>24){finish(false,'Время вышло');return}
 trail.push({x:ball.x,y:ball.y});if(trail.length>22)trail.shift();
}
function dot(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}
function line(a,b,w,c){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke()}
function star(x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const ang=-Math.PI/2+i*Math.PI/5,radius=i%2?r*.43:r;if(i)ctx.lineTo(x+Math.cos(ang)*radius,y+Math.sin(ang)*radius);else ctx.moveTo(x+Math.cos(ang)*radius,y+Math.sin(ang)*radius)}ctx.closePath()}
function draw(){
 ctx.fillStyle='#080808';ctx.fillRect(0,0,W,H);
 for(const p of platforms){line(p.a,p.b,9,'#252525');line(p.a,p.b,4,'#747474');}
 for(const h of hazards){ctx.save();ctx.translate(h.x,h.y);ctx.rotate(clock*.7);ctx.beginPath();for(let i=0;i<20;i++){const a=i*Math.PI/10,r=i%2?8:16;i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fillStyle='#bb4949';ctx.fill();ctx.restore()}
 for(const s of stars)if(!s.got){star(s.x,s.y,9);ctx.fillStyle='#e2ca83';ctx.fill()}
 for(const s of strokes){if(s.points.length<2)continue;ctx.save();ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);for(let i=1;i<s.points.length;i++)ctx.lineTo(s.points[i].x,s.points[i].y);ctx.strokeStyle='#eeeeee';ctx.lineWidth=4;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();ctx.restore()}
 if(tapStart){dot(tapStart.x,tapStart.y,4,'#fff');ctx.beginPath();ctx.arc(tapStart.x,tapStart.y,10,0,Math.PI*2);ctx.strokeStyle='#777';ctx.lineWidth=1;ctx.stroke()}
 ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=12;ctx.strokeStyle='#eee';ctx.lineWidth=3;ctx.beginPath();ctx.arc(goal.x,goal.y,22,0,Math.PI*2);ctx.stroke();ctx.restore();
 ctx.fillStyle='#777';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText('ЦЕЛЬ',goal.x,goal.y-35);
 ctx.fillStyle='#666';ctx.fillText('СТАРТ',spawn.x,spawn.y-25);
 for(let i=0;i<trail.length;i++){const p=trail[i];dot(p.x,p.y,1.5+2*i/trail.length,`rgba(255,255,255,${.08+.13*i/trail.length})`)}
 ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=14;dot(ball.x,ball.y,R,'#fff');ctx.restore();
 if(!hasDrawn&&phase==='ready'){
  ctx.fillStyle='#777';ctx.font='12px system-ui';ctx.textAlign='center';
  ctx.fillText('Нарисуй линию пальцем',180,246);
  ctx.fillText('или задай её двумя касаниями',180,264);
 }
}
function resize(){const r=canvas.getBoundingClientRect();if(!r.width||!r.height)return;const dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}
let last=performance.now(),acc=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;if(phase==='running'){
 acc+=dt;let i=0;while(acc>=1/120&&i<7&&phase==='running'){physics(1/120);acc-=1/120;i++}if(i===7)acc=0;
}else acc=0;
 draw();requestAnimationFrame(frame);
}
makeLevel();resize();
if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe($('board'));else addEventListener('resize',resize);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
