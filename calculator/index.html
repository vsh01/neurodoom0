<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1724">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="description" content="Муркулятор — калькулятор, в котором помогают считать котики.">
<title>Муркулятор 🐱</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color-scheme:dark;background:#1b1723;color:#fff8f6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;overscroll-behavior:none}
body{background:radial-gradient(ellipse 70% 44% at 50% 0%,#463047 0%,transparent 90%),#1b1723}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid #ffcb8c;outline-offset:3px}
#app{max-width:480px;min-height:100vh;min-height:100dvh;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 13px);display:flex;flex-direction:column;gap:11px;position:relative;isolation:isolate}
header{min-height:38px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:9px}
.logo-icon{font-size:23px;filter:drop-shadow(0 3px 6px #09070b66);animation:logo-bob 3s ease-in-out infinite}
.brand{font-size:16px;font-weight:950;letter-spacing:.07em;color:#ffcfbb}
.tagline{font-size:10px;letter-spacing:.09em;color:#bda8bc;margin-top:2px}
.fish-counter{border:1px solid #705469;border-radius:999px;background:#322535;padding:8px 11px;color:#f8dbc7;font-size:13px;min-width:58px;text-align:center;font-weight:750;white-space:nowrap}
.screen{flex:1;min-height:196px;display:flex;flex-direction:column;justify-content:space-between;position:relative;background:linear-gradient(165deg,#30263999,#241e2c77);border:1px solid #483649;border-radius:27px;padding:9px 17px 15px;overflow:hidden}
.scene{position:relative;min-height:132px;display:flex;align-items:center;justify-content:center;padding-top:7px}
.bubble{position:absolute;left:1px;top:3px;max-width:175px;padding:9px 11px;background:#fff1dc;color:#604054;border-radius:13px 13px 13px 4px;font-size:12px;line-height:1.3;font-weight:730;z-index:2;box-shadow:0 4px 0 #8b56653a;transform:rotate(-3deg);transition:transform .15s}
.bubble::after{content:"";position:absolute;left:9px;bottom:-9px;border-width:9px 11px 0 0;border-style:solid;border-color:#fff1dc transparent transparent transparent}
.deco{position:absolute;color:#f8bcb0;opacity:.75;font-size:16px;pointer-events:none}
.deco.one{right:10px;top:18px}.deco.two{right:50px;bottom:25px;font-size:12px}.deco.three{left:10px;bottom:10px;color:#c6a2ca}
.cat-touch{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:158px;height:122px;border:0;background:transparent;padding:0;z-index:1;cursor:pointer;outline-offset:-2px}
.cat{position:absolute;inset:0;transform-origin:50% 80%;filter:drop-shadow(0 7px 0 #14101950)}
.ear{position:absolute;top:3px;width:48px;height:55px;background:#e8a46d;clip-path:polygon(3% 0,100% 22%,95% 100%,0 92%);z-index:0}
.ear::before{content:"";position:absolute;inset:10px 13px 7px 8px;background:#f1b8a5;clip-path:polygon(0 0,100% 22%,100% 100%,0 90%)}
.ear.left{left:17px;transform:rotate(-21deg)}.ear.right{right:17px;transform:scaleX(-1) rotate(-21deg)}
.cat-face{position:absolute;left:7px;top:25px;width:144px;height:91px;background:linear-gradient(145deg,#ffcb91,#efa878);border-radius:52% 52% 47% 47%;border:3px solid #c98466;z-index:1;box-shadow:inset 0 -8px 0 #efab8055}
.stripe{position:absolute;top:1px;width:8px;height:18px;background:#d98961;border-radius:0 0 10px 10px;opacity:.75}
.stripe.a{left:55px;transform:rotate(16deg)}.stripe.b{left:70px;height:23px}.stripe.c{left:85px;transform:rotate(-16deg)}
.eye{position:absolute;top:35px;width:13px;height:16px;border-radius:60%;background:#473344;animation:blink 5.3s infinite;transform-origin:center}
.eye::after{content:"";position:absolute;top:3px;left:3px;width:4px;height:4px;border-radius:50%;background:#fff7f3}
.eye.left{left:36px}.eye.right{right:36px;animation-delay:.12s}
.cheek{position:absolute;top:55px;width:22px;height:11px;border-radius:50%;background:#f69aa0a6;filter:blur(2px)}
.cheek.left{left:18px}.cheek.right{right:18px}
.nose{position:absolute;top:52px;left:50%;transform:translateX(-50%);width:10px;height:7px;border-radius:35% 35% 65% 65%;background:#9f5260}
.mouth{position:absolute;top:57px;left:50%;transform:translateX(-50%);font-size:18px;color:#754756;line-height:1}
.whisker{position:absolute;top:56px;width:26px;height:1.5px;background:#9e665e;border-radius:5px}
.whisker.l1{left:-7px;transform:rotate(11deg)}.whisker.l2{left:-7px;top:64px;transform:rotate(-11deg)}.whisker.r1{right:-7px;transform:rotate(-11deg)}.whisker.r2{right:-7px;top:64px;transform:rotate(11deg)}
.paw{position:absolute;bottom:-4px;width:32px;height:20px;background:#ffd5a1;border:2px solid #cf9872;border-radius:50%;z-index:3;box-shadow:inset -1px -3px 0 #ebb384}
.paw.left{left:30px;transform:rotate(14deg)}.paw.right{right:30px;transform:rotate(-14deg)}
.paw::after{content:"";position:absolute;top:6px;left:13px;width:2px;height:6px;background:#c98e76;border-radius:3px;box-shadow:7px -1px #c98e76}
.cat.happy{animation:cat-hop .65s ease-in-out 2}
.cat.happy .eye{height:9px;border-radius:0 0 15px 15px;background:transparent;border-bottom:3px solid #493344;animation:none;top:39px}
.cat.happy .eye::after{display:none}
.cat.happy .mouth{font-size:22px;top:53px}
.cat.happy .paw.left{animation:wave-left .4s ease-in-out 3}
.cat.happy .paw.right{animation:wave-right .4s ease-in-out 3}
.cat.think .ear.right{animation:ear-twitch .3s ease-in-out 2}
.cat.think{animation:cat-tilt .6s ease-in-out}
.cat.oops{animation:cat-shock .55s ease-in-out}
.cat.oops .eye{width:20px;height:24px;top:31px;animation:none}
.cat.oops .mouth{font-size:24px;top:55px}
.cat.pet{animation:cat-nuzzle .55s ease-in-out 2}
.readout{width:100%;text-align:right;min-width:0;margin-top:auto}
#history{color:#c1a9c3;font-size:16px;min-height:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outrow{display:flex;align-items:center;justify-content:flex-end;gap:4px}
#output{display:block;max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.15;font-variant-numeric:tabular-nums;font-size:clamp(44px,11vw,70px);font-weight:400;letter-spacing:-.052em;color:#fff8ef}
#copy{background:transparent;border:0;color:#c6a3aa;padding:8px;border-radius:10px;flex:none}
#copy svg{display:block;width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.keys{height:min(53dvh,470px);min-height:300px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:9px}
.key{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:19px;border:1.5px solid #644760;background:linear-gradient(160deg,#48344a,#352b3c);color:#fff4ed;font-size:clamp(23px,6.3vw,31px);font-weight:660;box-shadow:0 4px 0 #100c16b0;user-select:none;-webkit-user-select:none;transition:transform .11s,background .11s,box-shadow .11s}
.key:active{transform:translateY(3px) scale(.97);box-shadow:0 1px 0 #100c16b0}
.key.number{background:linear-gradient(145deg,#4c3c55,#372d44)}
.key::after{content:"";position:absolute;inset:auto 0 0;height:24%;background:linear-gradient(0deg,#130c1c22,transparent);pointer-events:none}
.key .key-label{position:relative;z-index:2}
.key .cat-stamp{position:absolute;right:6px;top:4px;line-height:1;font-size:clamp(13px,3.8vw,19px);opacity:.89;filter:drop-shadow(0 1px 2px #170b1b55);transform:rotate(9deg);z-index:1;pointer-events:none;transition:transform .16s}
.key:active .cat-stamp{transform:rotate(-18deg) scale(1.35)}
.key.utility{background:linear-gradient(145deg,#665064,#4a384f);font-size:23px}
.key.op{background:linear-gradient(145deg,#775068,#56364e);color:#ffe1b9}
.key.op.active{background:#ffd3a0;color:#4c2946}
.key.equal{background:linear-gradient(145deg,#ffcf9d,#e79b8d);border-color:#ffe0aa;color:#572b40;box-shadow:0 4px 0 #733c4b9c;font-size:35px}
.key.equal .cat-stamp{font-size:21px}
.key svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#effects{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.paw-fx{position:fixed;line-height:1;animation:paw-fly .82s ease-out both;will-change:transform,opacity;filter:drop-shadow(0 3px 2px #0005)}
.celebrate-fx{position:fixed;line-height:1;animation:celebrate 1.4s ease-out both;will-change:transform,opacity;filter:drop-shadow(0 3px 4px #10071744)}
footer{color:#a58ea6;text-align:center;font-size:11px;min-height:15px}
@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.11)}}
@keyframes logo-bob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(9deg)}}
@keyframes cat-hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-9px) rotate(-4deg)}70%{transform:translateY(-4px) rotate(5deg)}}
@keyframes cat-tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
@keyframes cat-shock{0%,100%{transform:rotate(0)}20%,65%{transform:rotate(-8deg)}40%,85%{transform:rotate(8deg)}}
@keyframes cat-nuzzle{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg) scale(1.04)}}
@keyframes wave-left{0%,100%{transform:rotate(14deg)}50%{transform:translate(-8px,-12px) rotate(35deg)}}
@keyframes wave-right{0%,100%{transform:rotate(-14deg)}50%{transform:translate(8px,-12px) rotate(-35deg)}}
@keyframes ear-twitch{0%,100%{transform:scaleX(-1) rotate(-21deg)}50%{transform:scaleX(-1) rotate(-5deg)}}
@keyframes paw-fly{0%{opacity:0;transform:translate(-50%,-30%) scale(.35) rotate(-25deg)}18%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-100% - 65px)) scale(1.35) rotate(var(--rot))}}
@keyframes celebrate{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-25deg)}17%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(1.15)}}
@media(max-height:700px){#app{gap:8px;padding-top:calc(env(safe-area-inset-top) + 7px);padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}header{min-height:30px}.brand{font-size:14px}.tagline{display:none}.keys{height:55dvh;min-height:254px;gap:7px}.key{border-radius:14px}.screen{min-height:160px;padding:5px 13px 9px}.scene{min-height:108px}.cat-touch{transform:translateX(-50%) scale(.85);transform-origin:bottom center}.bubble{font-size:11px;max-width:150px;padding:7px 9px}footer{display:none}}
@media(max-height:530px){.scene{min-height:80px}.cat-touch{transform:translateX(-50%) scale(.65)}.screen{min-height:130px}.keys{height:52dvh;min-height:205px}.key .cat-stamp{top:3px;font-size:13px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="app">
<header>
 <div class="logo"><span class="logo-icon" aria-hidden="true">🐾</span><div><div class="brand">МУРКУЛЯТОР</div><div class="tagline">считаем лапками · мяу!</div></div></div>
 <span class="fish-counter" id="fish-counter" aria-label="Решено примеров">🐟 0</span>
</header>
<section class="screen" aria-label="Экран муркулятора">
 <div class="scene">
  <span class="deco one" aria-hidden="true">✦</span><span class="deco two" aria-hidden="true">✧</span><span class="deco three" aria-hidden="true">✳</span>
  <div class="bubble" id="bubble">Мяу! Давай считать 🐾</div>
  <button type="button" class="cat-touch" id="pet-cat" aria-label="Погладить котика">
   <span class="cat" id="cat" aria-hidden="true">
    <span class="ear left"></span><span class="ear right"></span>
    <span class="cat-face">
     <span class="stripe a"></span><span class="stripe b"></span><span class="stripe c"></span>
     <span class="eye left"></span><span class="eye right"></span>
     <span class="cheek left"></span><span class="cheek right"></span>
     <span class="nose"></span><span class="mouth">ω</span>
     <span class="whisker l1"></span><span class="whisker l2"></span><span class="whisker r1"></span><span class="whisker r2"></span>
    </span>
    <span class="paw left"></span><span class="paw right"></span>
   </span>
  </button>
 </div>
 <div class="readout">
  <div id="history" aria-live="polite"></div>
  <div class="outrow"><output id="output" aria-live="polite" aria-atomic="true">0</output>
   <button id="copy" aria-label="Скопировать результат" title="Скопировать результат" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
  </div>
 </div>
</section>
<section class="keys" aria-label="Кнопки калькулятора">
<button type="button" class="key utility" data-v="clear" aria-label="Очистить"><span class="key-label">AC</span></button>
<button type="button" class="key utility" data-v="sign" aria-label="Изменить знак"><span class="key-label">±</span></button>
<button type="button" class="key utility" data-v="percent" aria-label="Проценты"><span class="key-label">%</span></button>
<button type="button" class="key op" data-v="/" aria-label="Разделить"><span class="key-label">÷</span></button>
<button type="button" class="key number" data-v="7"><span class="key-label">7</span></button>
<button type="button" class="key number" data-v="8"><span class="key-label">8</span></button>
<button type="button" class="key number" data-v="9"><span class="key-label">9</span></button>
<button type="button" class="key op" data-v="*" aria-label="Умножить"><span class="key-label">×</span></button>
<button type="button" class="key number" data-v="4"><span class="key-label">4</span></button>
<button type="button" class="key number" data-v="5"><span class="key-label">5</span></button>
<button type="button" class="key number" data-v="6"><span class="key-label">6</span></button>
<button type="button" class="key op" data-v="-" aria-label="Вычесть"><span class="key-label">−</span></button>
<button type="button" class="key number" data-v="1"><span class="key-label">1</span></button>
<button type="button" class="key number" data-v="2"><span class="key-label">2</span></button>
<button type="button" class="key number" data-v="3"><span class="key-label">3</span></button>
<button type="button" class="key op" data-v="+" aria-label="Сложить"><span class="key-label">+</span></button>
<button type="button" class="key utility" data-v="back" aria-label="Удалить символ"><span class="key-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H20a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H9L2 12l7-8Z"/><path d="m12 9 6 6m0-6-6 6"/></svg></span></button>
<button type="button" class="key number" data-v="0"><span class="key-label">0</span></button>
<button type="button" class="key number" data-v="." aria-label="Десятичная запятая"><span class="key-label">,</span></button>
<button type="button" class="key equal" data-v="=" aria-label="Равно"><span class="key-label">=</span></button>
</section>
<footer>Нажми на котика, чтобы погладить · клавиатура тоже работает</footer>
</main>
<div id="effects" aria-hidden="true"></div>
<script>
(() => {
 'use strict';
 const output=document.getElementById('output');
 const historyEl=document.getElementById('history');
 const bubble=document.getElementById('bubble');
 const cat=document.getElementById('cat');
 const fx=document.getElementById('effects');
 const fishCounter=document.getElementById('fish-counter');
 const symbols={'+':'+','-':'−','*':'×','/':'÷'};
 let current='0',saved=null,op=null,awaiting=false,history='',lastOp=null,lastArg=null,evaluated=false,error=false,fish=0;
 let moodTimeout=0;
 const reducedMotion=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const stampFaces=['😺','😸','😻','😽','😼','🐱','😹','🙀','😺','😸','🐾'];
 document.querySelectorAll('.keys .key').forEach((button,index)=>{
  const stamp=document.createElement('span');
  stamp.className='cat-stamp';
  stamp.setAttribute('aria-hidden','true');
  stamp.textContent=button.classList.contains('equal')?'🐾':stampFaces[index%stampFaces.length];
  button.appendChild(stamp);
 });
 function fmt(raw){
  const s=String(raw);
  if(s==='Ошибка'||s.includes('e'))return s.replace('.',',');
  const negative=s.startsWith('-')?'−':'';
  const v=negative?s.slice(1):s;
  const p=v.split('.');
  return negative+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'\u202f')+(p.length>1?','+p[1]:'');
 }
 function round(n){return Number.isFinite(n)?String(Number(n.toPrecision(13))):null}
 function calc(a,b,o){if(o==='+')return a+b;if(o==='-')return a-b;if(o==='*')return a*b;if(o==='/')return b===0?NaN:a/b;return b}
 function reset(){current='0';saved=null;op=null;awaiting=false;history='';lastOp=null;lastArg=null;evaluated=false;error=false}
 function mood(name,text){
  clearTimeout(moodTimeout);
  cat.className='cat '+name;
  bubble.textContent=text;
  if(name)moodTimeout=setTimeout(()=>{cat.className='cat'},1500);
 }
 function particle(emoji,x,y,cls,dx,dy,rot){
  if(reducedMotion)return;
  const el=document.createElement('span');
  el.className=cls;
  el.textContent=emoji;
  el.style.left=x+'px';el.style.top=y+'px';
  el.style.fontSize=(cls==='paw-fx'?22:22+Math.random()*14)+'px';
  el.style.setProperty('--dx',dx+'px');
  el.style.setProperty('--dy',dy+'px');
  el.style.setProperty('--rot',rot+'deg');
  fx.appendChild(el);
  el.addEventListener('animationend',()=>el.remove(),{once:true});
  setTimeout(()=>el.remove(),1800);
 }
 function pawPop(element){
  if(!element)return;
  const r=element.getBoundingClientRect();
  particle('🐾',r.left+r.width*(.35+Math.random()*.3),r.top+r.height*.48,'paw-fx',(Math.random()-.5)*58,-70,(Math.random()-.5)*60);
 }
 function party(){
  if(reducedMotion)return;
  const r=cat.getBoundingClientRect();
  const em=['🐾','🐱','😻','✨','💖','🐟','💛'];
  for(let i=0;i<11;i++){
   const x=r.left+r.width*(.15+Math.random()*.7);
   const y=r.top+r.height*(.25+Math.random()*.4);
   particle(em[i%em.length],x,y,'celebrate-fx',(Math.random()-.5)*310,-55-Math.random()*150,(Math.random()-.5)*180);
  }
 }
 function fail(){error=true;current='Ошибка';saved=null;op=null;awaiting=false;history='Невозможно вычислить';lastOp=null;lastArg=null;evaluated=false;mood('oops','На ноль?! МЯЯЯУ! 🙀')}
 function render(){
  const display=fmt(current);
  output.textContent=display;historyEl.textContent=history;
  output.style.fontSize=display.length>18?'27px':display.length>14?'37px':display.length>11?'46px':'';
  document.querySelectorAll('.key.op').forEach(b=>{const active=b.dataset.v===op&&awaiting;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});
 }
 function start(){if(error)reset();if(evaluated&&op===null){history='';lastOp=null;lastArg=null;evaluated=false}}
 function digit(v){start();if(awaiting){current='0';awaiting=false}if(current.replace(/\D/g,'').length>=13)return;if(current==='0')current=v;else if(current==='-0')current='-'+v;else current+=v}
 function dot(){start();if(awaiting){current='0';awaiting=false}if(!current.includes('.'))current+='.'}
 function sign(){if(error){reset();return}if(awaiting){current='0';awaiting=false}current=current.startsWith('-')?current.slice(1):'-'+current;evaluated=false}
 function percent(){if(error)return;if(awaiting){current='0';awaiting=false}const n=Number(current);const v=round(saved!==null&&(op==='+'||op==='-')?saved*n/100:n/100);if(v===null)fail();else current=v;evaluated=false}
 function operator(next){
  if(error)return;
  if(saved!==null&&op!==null&&!awaiting){
   const v=round(calc(saved,Number(current),op));
   if(v===null){fail();return}
   current=v;saved=Number(v);
  }else if(saved===null)saved=Number(current);
  op=next;awaiting=true;evaluated=false;lastOp=null;lastArg=null;
  history=fmt(current)+' '+symbols[next];
  mood('think',next==='/'?'Делю рыбок поровну… 🐟':'Кот считает на усах…');
 }
 function celebrateResult(){
  fish++;
  fishCounter.textContent='🐟 '+fish;
  fishCounter.setAttribute('aria-label','Решено примеров: '+fish);
  const lines=['Мурр! Всё сошлось! 😻','Верно, двуногий! 🐾','Матемяутика! ✨','Полагается рыбка! 🐟','Умный котик доволен! 💛'];
  mood('happy',lines[fish%lines.length]);
  party();
 }
 function equals(){
  if(error)return;
  if(op!==null&&saved!==null){
   const a=saved,b=awaiting?saved:Number(current),o=op;
   const v=round(calc(a,b,o));if(v===null){fail();return}
   history=fmt(a)+' '+symbols[o]+' '+fmt(b)+' =';
   current=v;saved=null;op=null;awaiting=true;evaluated=true;lastOp=o;lastArg=b;
   celebrateResult();
  }else if(lastOp!==null){
   const a=Number(current),v=round(calc(a,lastArg,lastOp));
   if(v===null){fail();return}
   history=fmt(a)+' '+symbols[lastOp]+' '+fmt(lastArg)+' =';
   current=v;awaiting=true;evaluated=true;
   celebrateResult();
  }else{
   mood('pet','Тут уже всё посчитано! 😺');
  }
 }
 function back(){
  if(error){reset();return}
  if(awaiting&&op!==null)return;
  if(evaluated){history='';lastOp=null;lastArg=null;evaluated=false}
  current=current.length<=1||(current.length===2&&current[0]==='-')?'0':current.slice(0,-1)
 }
 function press(v,element){
  if(/^[0-9]$/.test(v)){digit(v);if(error===false&&v==='0'&&current==='0')mood('pet','Ноль рыбок... 😿')}
  else if(v==='.')dot();
  else if(v==='clear'){reset();mood('pet','Начнём с чистой миски! 🐱')}
  else if(v==='back')back();
  else if(v==='sign')sign();
  else if(v==='percent')percent();
  else if(Object.prototype.hasOwnProperty.call(symbols,v))operator(v);
  else if(v==='=')equals();
  pawPop(element);
  render();
 }
 const keys=document.querySelector('.keys');
 keys.addEventListener('click',e=>{
  const b=e.target.closest('button[data-v]');if(b)press(b.dataset.v,b);
 });
 document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.altKey||e.metaKey)return;
  const k=e.key;let v=null;
  if(/^[0-9]$/.test(k))v=k;
  else if(k==='.'||k===',')v='.';
  else if(['+','-','*','/'].includes(k))v=k;
  else if(k==='x'||k==='X')v='*';
  else if(k==='Enter'||k==='=')v='=';
  else if(k==='Backspace')v='back';
  else if(k==='Escape'||k==='Delete')v='clear';
  else if(k==='%')v='percent';
  if(v!==null){e.preventDefault();press(v,Array.from(keys.querySelectorAll('[data-v]')).find(b=>b.dataset.v===v))}
 });
 document.getElementById('pet-cat').addEventListener('click',()=>{
  mood('pet',['Прррр... 🧡','Ты мой любимый человек! 😽','Ещё погладь! 🐾','Мяу-мяу! 😺'][Math.floor(Math.random()*4)]);
  const r=cat.getBoundingClientRect();
  for(let i=0;i<3;i++)particle('💖',r.left+r.width*(.3+.2*i),r.top+r.height*.7,'celebrate-fx',(i-1)*72,-65-i*16,(i-1)*35);
 });
 document.getElementById('copy').addEventListener('click',async()=>{
  if(error)return;
  try{
   await navigator.clipboard.writeText(current);
   mood('happy','Скопировано! Держи 🐾');
   const b=document.getElementById('copy');b.title='Скопировано';b.setAttribute('aria-label','Скопировано');
   setTimeout(()=>{b.title='Скопировать результат';b.setAttribute('aria-label','Скопировать результат')},1200);
  }catch(_){mood('oops','Не удалось скопировать 🙀')}
 });
 render();
})();
</script>
</body>
