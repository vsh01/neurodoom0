name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/doom-github-pages-deploy-i0p5ai
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify game data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check modules and level geometry
        run: node scripts/verify.mjs

  deploy:
    name: Build and deploy
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on for this repository if it is not enabled yet.
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published calculator URL
        shell: bash
        run: |
          url="${{ steps.deployment.outputs.page_url }}calculator/"
          echo "Checking published page: $url"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 20 "$url" | grep -qF '<title>Калькулятор</title>'; then
              echo "Calculator page is publicly reachable and contains its HTML."
              exit 0
            fi
            echo "Attempt $attempt: calculator was not reachable yet."
            sleep 6
          done
          echo "::error::Calculator URL failed the post-deploy smoke test."
          exit 1
