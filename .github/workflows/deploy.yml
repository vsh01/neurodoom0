name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/doom-github-pages-deploy-i0p5ai
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify game data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check modules and level geometry
        run: node scripts/verify.mjs

  deploy:
    name: Build and deploy
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on for this repository if it is not enabled yet.
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check Murculator JavaScript syntax and cat controls
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('calculator/index.html', 'utf8');
          const script = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!script) throw new Error('Calculator script missing');
          new vm.Script(script[1], { filename: 'calculator.js' });
          const buttons = (html.match(/data-v="/g) || []).length;
          if (buttons !== 20 || !html.includes('id="pet-cat"') || !html.includes('class="cat-stamp"')) {
            // Cat stamps are generated at runtime; their markup is not in the static HTML.
            if (buttons !== 20 || !html.includes('id="pet-cat"') || !html.includes("stamp.className='cat-stamp'")) {
              throw new Error('Cat UI or calculator buttons missing');
            }
          }
          console.log('Murculator JS syntax, 20 calculator buttons and cat controls verified');
          NODE
      - name: Verify published calculator URL
        shell: bash
        run: |
          url="${{ steps.deployment.outputs.page_url }}calculator/"
          echo "Checking published page: $url"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 20 "$url" | grep -qF '<title>Муркулятор 🐱</title>'; then
              echo "Calculator page is publicly reachable and contains its HTML."
              exit 0
            fi
            echo "Attempt $attempt: calculator was not reachable yet."
            sleep 6
          done
          echo "::error::Calculator URL failed the post-deploy smoke test."
          exit 1
